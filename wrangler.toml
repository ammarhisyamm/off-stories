# Cloudflare Pages project configuration.
#
# Build:            npm run build   (emits static assets to dist/ + a single
#                                    dist/_worker.js Pages Function for SSR)
# Preview locally:  wrangler pages dev dist
# Deploy:           wrangler pages deploy dist
#
# Data and session state run on Cloudflare D1 through the `DB` binding below.
# Add the same D1 binding in Pages > Settings > Bindings before production deploy.
name = "off-stories"

compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "off-stories"
database_id = "d8694ba5-e0d2-48c5-a3c2-3567dabc13fa"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "off-stories-documents"
